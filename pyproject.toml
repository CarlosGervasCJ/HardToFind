[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-spherex-api"
version = "0.1.0"
description = "API Flask para consultas astronômicas SPHEREx"
requires-python = ">=3.10"

dependencies = [
    "Flask>=3.0.0",
    "gunicorn>=21.0.0",
    "astropy>=6.0.0",
    "astroquery>=0.4.0",
    "flask-cors>=4.0.0"
]

[tool.setuptools]
py-modules = ["main", "items"]
